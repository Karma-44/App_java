<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<defs>
<style>
.bg { fill: #1c2b66; }
.text-k { font-family: sans-serif; font-weight: 900; font-size: 260px; fill: #f4efe6; }
.text-ee { font-family: sans-serif; font-weight: 800; font-size: 110px; fill: none; stroke: #f4efe6; stroke-width: 8; stroke-linejoin: round; }
.text-alive { font-family: sans-serif; font-weight: 800; font-size: 95px; fill: #f4efe6; }
</style>
</defs>
<!-- Background rect if used directly -->
<rect width="512" height="512" rx="112" class="bg"/>
<!-- Logo Composition -->
<g transform="translate(45, 80)">
<!-- Big K -->
<text x="0" y="240" class="text-k">K</text>
<!-- 'ee' stylized upper part matching the user's sketch -->
<path d="M165,120 L240,120 L210,165 L245,165 L180,220 L225,220 Z" fill="none" stroke="#f4efe6" stroke-width="8" stroke-linejoin="round"/>
<path d="M260,120 L335,120 L305,165 L340,165 L275,220 L320,220 Z" fill="none" stroke="#f4efe6" stroke-width="8" stroke-linejoin="round"/>
<!-- 'Alive' text part below -->
<text x="75" y="320" class="text-alive">Alive</text>
</g>
</svg>
